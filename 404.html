<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Victor Tarra</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;900&display=swap" rel="stylesheet" />
  <style>
    :root { --paper: #F6F7F9; --ink: #141A26; --muted: #5A6372; --rule: #DCE0E6; --line: #2D4FB8; }
    @media (prefers-color-scheme: dark) { :root { --paper: #0E131C; --ink: #E7EAF0; --muted: #98A1B0; --rule: #263040; --line: #7D97F0; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh; display: flex; flex-direction: column; justify-content: center; gap: 24px;
      padding: clamp(24px, 6vw, 96px);
      font: 400 17px/1.6 "Overpass", "Segoe UI", system-ui, sans-serif;
      background: var(--paper); color: var(--ink);
    }
    .track { display: flex; align-items: center; max-width: 420px; }
    .track span { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--line); background: var(--paper); flex-shrink: 0; }
    .track i { flex: 1; height: 8px; background: var(--line); }
    .track i.gap { background: repeating-linear-gradient(90deg, var(--rule) 0 10px, transparent 10px 18px); }
    .track span.end { background: var(--paper); border-color: var(--rule); }
    h1 { font-size: clamp(48px, 9vw, 112px); line-height: .9; letter-spacing: -.05em; font-weight: 900; }
    p { max-width: 44ch; color: var(--muted); }
    nav { display: flex; flex-wrap: wrap; gap: 12px; }
    a { color: var(--ink); font-weight: 600; text-decoration: none; padding: 12px 20px 10px; border: 2px solid var(--ink); border-radius: 4px; }
    a:first-child { background: var(--line); border-color: var(--line); color: #fff; }
    a:hover { background: #213C91; border-color: #213C91; color: #fff; }
    a:focus-visible { outline: 3px solid #2D4FB8; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="track" aria-hidden="true"><span></span><i></i><i class="gap"></i><span class="end"></span></div>
  <h1>This stop doesn't exist.</h1>
  <p>Error 404. The page you were looking for has moved or was never here.</p>
  <nav>
    <a href="/MyPortfolio/">Back to portfolio</a>
    <a href="/MyPortfolio/#projects">Projects</a>
    <a href="/MyPortfolio/#contact">Contact</a>
  </nav>
</body>
</html>
