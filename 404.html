<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Victor Tarra</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #ffffff; --text: #111111; --muted: #6e6e73; --border: #e5e5e5; }
        body {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 26px;
            padding: clamp(28px, 5vw, 96px);
            font-family: -apple-system, BlinkMacSystemFont, "San Francisco", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .code { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
        h1 { font-size: clamp(56px, 8vw, 120px); line-height: .94; letter-spacing: -.06em; font-weight: 650; }
        p { max-width: 44ch; font-size: 16px; color: var(--muted); }
        nav { display: flex; flex-wrap: wrap; gap: 20px; }
        a { color: var(--text); font-size: 14px; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 3px; }
        a:hover { color: var(--muted); }
        a:focus-visible { outline: 2px solid var(--text); outline-offset: 5px; }
    </style>
</head>
<body>
    <p class="code">Error 404</p>
    <h1>Page not found.</h1>
    <p>The page you were looking for doesn&rsquo;t exist or has moved.</p>
    <nav>
        <a href="/MyPortfolio/">Back to portfolio</a>
        <a href="/MyPortfolio/#projects">My Projects</a>
        <a href="/MyPortfolio/#contact">Contact</a>
    </nav>
</body>
</html>
